<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday yott my love 🎉</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Poppins', sans-serif;
    }

    body {
        min-height: 100vh;
        background: linear-gradient(270deg, #ff9a9e, #fad0c4, #fbc2eb, #a18cd1);
        background-size: 800% 800%;
        animation: gradientBG 15s ease infinite;
        overflow-x: hidden;
        text-align: center;
        color: white;
    }

    @keyframes gradientBG {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }

    h1 {
        margin-top: 50px;
        font-size: 3rem;
        text-shadow: 0 0 20px rgba(255,255,255,0.8);
        animation: glow 2s infinite alternate;
    }

    @keyframes glow {
        from { text-shadow: 0 0 10px #fff; }
        to { text-shadow: 0 0 30px #ffeb3b; }
    }

    .message {
        margin: 20px auto;
        max-width: 600px;
        font-size: 1.2rem;
        line-height: 1.6;
        background: rgba(0,0,0,0.25);
        padding: 20px;
        border-radius: 15px;
        animation: fadeIn 2s ease;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .gallery {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 15px;
        margin: 40px 20px;
    }

    .gallery img {
        width: 200px;
        height: 200px;
        object-fit: cover;
        border-radius: 20px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        transition: transform 0.4s;
    }

    .gallery img:hover {
        transform: scale(1.1) rotate(3deg);
    }

    /* Balloons */
    .balloon {
        position: fixed;
        bottom: -150px;
        width: 60px;
        height: 80px;
        background: red;
        border-radius: 50%;
        animation: floatUp 10s linear infinite;
        opacity: 0.8;
    }

    .balloon::after {
        content: '';
        position: absolute;
        width: 2px;
        height: 40px;
        background: white;
        top: 80px;
        left: 50%;
    }

    @keyframes floatUp {
        0% { transform: translateY(0); }
        100% { transform: translateY(-120vh); }
    }

    footer {
        margin: 30px;
        font-size: 0.9rem;
        opacity: 0.8;
    }
</style>
</head>

<body>

<h1>🎂 Happy Birthday, My Best Friend! 🎉</h1>

<div class="message">
    Today is all about you yott 💖  
    Thank you for the laughter, the memories, and the friendship that makes life brighter.  
    May this year bring you happiness, success, and endless smiles! 🥳✨
</div>

</footer>

<!-- Balloons -->
<script>
    const colors = ['#ff5252', '#ff4081', '#7c4dff', '#40c4ff', '#69f0ae'];

    for (let i = 0; i < 25; i++) {
        const balloon = document.createElement('div');
        balloon.className = 'balloon';
        balloon.style.left = Math.random() * 100 + 'vw';
        balloon.style.background = colors[Math.floor(Math.random() * colors.length)];
        balloon.style.animationDuration = (8 + Math.random() * 5) + 's';
        document.body.appendChild(balloon);
    }
</script>

</body>
</html>
